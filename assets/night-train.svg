<svg xmlns="http://www.w3.org/2000/svg" width="720" height="216" viewBox="0 0 720 216" role="img" aria-labelledby="name description" shape-rendering="crispEdges">
  <title id="name">Erfurt to Jena · Return ticket</title>
  <desc id="description">A pixel train travels along a Git graph between Erfurt and Jena. The skyline between the cities is built from a year of GitHub contributions: every week with GitHub contributions adds a tower, every active day a lit window. The tear-off strip reads “git show 17084fd”. Open the ticket to see the reverse.</desc>
  <style>
    text { font: bold 16px ui-monospace, Consolas, monospace; letter-spacing: 1px; }
    .train { transform: translateX(273px); }
    .sun { display: none; }
    .ticket-command { font-size: 24px; letter-spacing: 0; }
    .ticket-action { font: 600 21px system-ui, sans-serif; letter-spacing: 0; }
    .lit { fill: #ffd28c; }
    .l1 { opacity: .35; } .l2 { opacity: .55; } .l3 { opacity: .8; }
    .tower { fill: #3d4468; }
    .crane { fill: #3d4468; }
    @media (prefers-color-scheme: light) {
      .lit { fill: #eef6f8; }
      .tower, .crane { fill: #5b7385; }
      .sky { fill: #d7ecf2; }
      .stars, .moon { display: none; }
      .sun { display: inline; }
      .hills { fill: #abcbd0; }
      .city { fill: #728c9c; }
      .signs { fill: #293d51; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .train { animation: commute 16s linear -4.5s infinite; }
      @keyframes commute {
        0%, 12%, 100% { transform: translateX(35px); }
        46%, 60% { transform: translateX(520px); }
        94% { transform: translateX(35px); }
      }
    }
  </style>
  <defs>
    <path id="star" d="M0 0h3v3H0z"/>
    <path id="spire" d="M0 55V34h3v-8h3v-9h3V9h2V0h2v9h2v8h3v9h3v8h3v21z"/>
    <g id="coach">
      <path d="M3 0h67v3h4v17h-3v3H3v-3H0V3h3z" fill="#87e6cc"/>
      <path d="M4 5h66v11H4z" fill="#213345"/>
      <path d="M8 6h13v8H8zm20 0h13v8H28zm20 0h13v8H48z" fill="#ffd28c"/>
      <path d="M1 18h72v3H1z" fill="#54a59e"/>
      <path d="M8 23h10v3H8zm48 0h10v3H56z" fill="#b9bbda"/>
    </g>
  </defs>
  <path class="sky" fill="#101426" d="M0 0h720v152H0z"/>
  <g class="stars" fill="#8893bd">
    <use href="#star" x="30" y="46"/><use href="#star" x="160" y="21"/><use href="#star" x="213" y="44"/><use href="#star" x="278" y="17"/>
    <use href="#star" x="359" y="29"/><use href="#star" x="422" y="14"/><use href="#star" x="465" y="47"/><use href="#star" x="540" y="21"/><use href="#star" x="687" y="40"/>
  </g>
