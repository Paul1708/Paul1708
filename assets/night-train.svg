    <path d="M68 18h16v3H68z" fill="#b9bbda"/>
    <use href="#coach"/><use href="#coach" x="79"/>
    <path fill="#213345" d="M9 8h2v2h4V8h2v6H9z"/>
    <path fill="#eee7ae" d="M0 14h3v3H0zm150 0h3v3h-3z"/>
  </g></g>
  <path fill="#dbece6" d="M0 152h720v64H0z"/>
  <path d="M1 154h718" stroke="#617c75" stroke-width="2" stroke-dasharray="6 5"/>
  <g fill="#203e3d">
    <path d="M20 171h3v27h-3zm6 0h2v27h-2zm5 0h5v27h-5zm8 0h2v27h-2zm5 0h4v27h-4zm7 0h2v27h-2z"/>
