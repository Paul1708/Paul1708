<svg xmlns="http://www.w3.org/2000/svg" width="430" height="180" viewBox="0 0 430 180" role="img" aria-labelledby="title description">
  <title id="title">Ein Durchlauf von Bubble Sort</title>
  <desc id="description">Ausgangsfolge: 5, 3, 8, 2, 6. Von links nach rechts werden 5 und 3 getauscht, 5 und 8 beibehalten, 8 und 2 getauscht und schließlich 8 und 6 getauscht. Ergebnis: 3, 5, 2, 6, 8.</desc>
  <style>
    text { font-family: system-ui, sans-serif; }
    .status { fill: #f8f7f3; font-size: 19px; font-weight: 600; }
    .readout { fill: #ff916a; font-family: ui-monospace, monospace; font-size: 18px; text-anchor: end; }
    .number { fill: #191b1a; font-size: 21px; font-weight: 750; text-anchor: middle; }
    @media (prefers-reduced-motion: no-preference) {
      .plot, .caption, .move, .color { animation: 8.8s ease-in-out infinite; }
      .plot { animation-name: restart; }
      .first { animation-name: first; }
      .second { animation-name: second; }
      .third { animation-name: third; }
      .fourth { animation-name: fourth; }
      .result { animation-name: result; }
      .move-three { animation-name: move-three; }
      .move-five { animation-name: move-five; }
      .move-two { animation-name: move-two; }
      .move-six { animation-name: move-six; }
      .move-eight { animation-name: move-eight; }
      .color-three { animation-name: color-three; }
      .color-five { animation-name: color-five; }
      .color-two { animation-name: color-two; }
      .color-six { animation-name: color-six; }
      .color-eight { animation-name: color-eight; }
    }
    @keyframes restart { 0%, 100% { opacity: 0; } 2%, 97% { opacity: 1; } }
    @keyframes first { 0%, 18% { opacity: 1; } 19.5%, 100% { opacity: 0; } }
    @keyframes second { 0%, 19.5%, 34.5%, 100% { opacity: 0; } 21%, 33% { opacity: 1; } }
    @keyframes third { 0%, 34.5%, 55%, 100% { opacity: 0; } 36%, 53.5% { opacity: 1; } }
    @keyframes fourth { 0%, 55%, 76%, 100% { opacity: 0; } 56.5%, 74.5% { opacity: 1; } }
    @keyframes result { 0%, 76% { opacity: 0; } 77.5%, 100% { opacity: 1; } }
    /* Each group starts at its final position so a still image shows the result. */
    @keyframes move-three { 0%, 11% { transform: translateX(76px); } 18%, 100% { transform: translateX(0); } }
    @keyframes move-five { 0%, 11% { transform: translateX(-76px); } 18%, 100% { transform: translateX(0); } }
    @keyframes move-two { 0%, 46% { transform: translateX(76px); } 53%, 100% { transform: translateX(0); } }
    @keyframes move-six { 0%, 67% { transform: translateX(76px); } 74%, 100% { transform: translateX(0); } }
    @keyframes move-eight {
      0%, 46% { transform: translateX(-152px); }
      53%, 67% { transform: translateX(-76px); }
      74%, 100% { transform: translateX(0); }
    }
    @keyframes color-three { 0%, 18% { fill: #ff6638; } 21%, 100% { fill: #c1c4b8; } }
    @keyframes color-five { 0%, 33% { fill: #ff6638; } 36%, 100% { fill: #c1c4b8; } }
    @keyframes color-two { 0%, 33%, 56.5%, 100% { fill: #c1c4b8; } 36%, 53.5% { fill: #ff6638; } }
    @keyframes color-six { 0%, 53.5%, 77.5%, 100% { fill: #c1c4b8; } 56.5%, 74.5% { fill: #ff6638; } }
    @keyframes color-eight { 0%, 18% { fill: #c1c4b8; } 21%, 100% { fill: #ff6638; } }
  </style>
  <rect width="430" height="180" rx="8" fill="#191b1a"/>
  <path d="M25 51.5h380m-380 35h380m-380 35h380" fill="none" stroke="#42453e" stroke-dasharray="2 5"/>
  <path d="M25 157.5h380m-342 0v5m76-5v5m76-5v5m76-5v5m76-5v5" fill="none" stroke="#898d81"/>
  <g class="plot">
    <g class="caption first" opacity="0">
      <text class="status" x="24" y="32">Vergleich 1/4</text><text class="readout" x="406" y="32">5 &gt; 3</text>
    </g>
    <g class="caption second" opacity="0">
      <text class="status" x="24" y="32">Vergleich 2/4</text><text class="readout" x="406" y="32">5 &lt; 8</text>
    </g>
    <g class="caption third" opacity="0">
      <text class="status" x="24" y="32">Vergleich 3/4</text><text class="readout" x="406" y="32">8 &gt; 2</text>
    </g>
    <g class="caption fourth" opacity="0">
      <text class="status" x="24" y="32">Vergleich 4/4</text><text class="readout" x="406" y="32">8 &gt; 6</text>
    </g>
    <g class="caption result" opacity="1">
      <text class="status" x="24" y="32">Durchlauf beendet</text><text class="readout" x="406" y="32">8 am Ziel</text>
    </g>
    <g transform="translate(63 0)"><g class="move move-three">
      <rect class="color color-three" x="-22" y="112" width="44" height="45" rx="3" fill="#c1c4b8"/><text class="number" x="0" y="148">3</text>
    </g></g>
    <g transform="translate(139 0)"><g class="move move-five">
      <rect class="color color-five" x="-22" y="88" width="44" height="69" rx="3" fill="#c1c4b8"/><text class="number" x="0" y="148">5</text>
    </g></g>
    <g transform="translate(215 0)"><g class="move move-two">
      <rect class="color color-two" x="-22" y="124" width="44" height="33" rx="3" fill="#c1c4b8"/><text class="number" x="0" y="148">2</text>
    </g></g>
    <g transform="translate(291 0)"><g class="move move-six">
      <rect class="color color-six" x="-22" y="76" width="44" height="81" rx="3" fill="#c1c4b8"/><text class="number" x="0" y="148">6</text>
    </g></g>
    <g transform="translate(367 0)"><g class="move move-eight">
      <rect class="color color-eight" x="-22" y="52" width="44" height="105" rx="3" fill="#ff6638"/><text class="number" x="0" y="148">8</text>
    </g></g>
  </g>
</svg>
